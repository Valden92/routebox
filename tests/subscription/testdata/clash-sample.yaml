proxies:
  - name: "NL VLESS Reality"
    type: vless
    server: 203.0.113.10
    port: 443
    uuid: 11111111-1111-1111-1111-111111111111
    network: tcp
    tls: true
    flow: xtls-rprx-vision
    servername: gateway.example.com
    client-fingerprint: chrome
    reality-opts:
      public-key: "abcdefghijklmnopqrstuvwxyz0123456789ABCD"
      short-id: "abcd1234"
  - name: "SS Node"
    type: ss
    server: 203.0.113.20
    port: 8388
    cipher: aes-256-gcm
    password: "s3cret"
  - name: "HY2 Node"
    type: hysteria2
    server: 203.0.113.30
    port: 443
    password: "hy2pass"
    sni: hy2.example.com
  - name: "Unsupported SSR"
    type: ssr
    server: 203.0.113.40
    port: 443
    password: "nope"
    cipher: aes-256-cfb
    protocol: origin
    obfs: plain

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - "NL VLESS Reality"
      - "SS Node"

rules:
  - MATCH,PROXY
