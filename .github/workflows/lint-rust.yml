# Опционально: clippy для тонкой Tauri-обёртки.
# Не в основном Lint — компиляция зависимостей Tauri тяжёлая и требует stub sidecar.
name: Lint Rust

on:
  push:
    branches: [main, master]
    paths:
      - "desktop/src-tauri/**"
      - ".github/workflows/lint-rust.yml"
  pull_request:
    paths:
      - "desktop/src-tauri/**"
      - ".github/workflows/lint-rust.yml"
  workflow_dispatch:

concurrency:
  group: lint-rust-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Stub sidecar for tauri-build
        run: |
          mkdir -p desktop/src-tauri/binaries
          touch desktop/src-tauri/binaries/vpn-router-daemon-x86_64-unknown-linux-gnu

      - name: Clippy
        run: make lint-rust
